# ===================================
# Smart HRMS - Application Properties
# ===================================

# Server
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_HRMS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=viyom@3107
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upload Directory
app.upload.dir=uploads

# JWT
app.jwt.secret=SmartHRMS_Super_Secret_Key_2025_@#$_abcdefgh
app.jwt.expiration=86400000

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**,WEB-INF/**,uploads/**

# Logging - DEBUG to trace redirect issue
logging.level.com.example.SHRMS=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN